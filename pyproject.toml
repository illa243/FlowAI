[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowai-desktop"
version = "0.3.0"
description = "Local visual workflow editor for Codex agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.9,<7",
  "openai-codex>=0.147,<0.148",
]

[project.scripts]
flowai = "flowai.app:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["flowai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
