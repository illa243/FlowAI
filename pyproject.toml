[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowai-desktop"
version = "0.4.0"
description = "Local visual workflow editor for Codex agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2,<2",
  "PySide6>=6.9,<7",
  "openai-codex>=0.147,<0.148",
  "send2trash>=1.8",
  "winrt-Windows.UI.Notifications>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Data.Xml.Dom>=3.0; sys_platform == 'win32'",
]

[project.gui-scripts]
flowai = "flowai.app:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["flowai*"]

[tool.setuptools.package-data]
"flowai.ui" = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/icons/*.svg", "assets/icons/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
